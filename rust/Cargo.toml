[package]
name = "crossterm-lean-ffi"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "crossterm_lean_ffi"
crate-type = ["staticlib"]

[dependencies]
crossterm = "0.29.0"
lean-sys = { git = "https://github.com/katzenpost/lean-sys", rev = "7b998184a82d6a6ddcc7626abf5eaac2e5345244", package = "katzenpost-lean-sys", default-features = false, features = ["mimalloc"] }

[profile.release]
panic = "abort"
